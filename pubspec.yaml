name: sire
description: "Sistema Integral de Reservas Estratégicas"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegación
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.8.4

  # HTTP
  dio: ^5.7.0

  # Geolocalización
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Almacenamiento local (token, preferencias)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Imágenes e Iconos
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

  # Variables de entorno
  flutter_dotenv: ^5.2.1

  # Utilidades
  equatable: ^2.0.7
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código para Riverpod
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1
  dart_pre_commit: ^6.0.0
  husky: ^0.1.7

  # Testing de integración (capa de datos contra HTTP simulado)
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-RegularItalic.otf
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-SemiBold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700

dart_pre_commit:
  format: true
  analyze: true
  custom_lint: true
  outdated: false
  pull-up-dependencies: false